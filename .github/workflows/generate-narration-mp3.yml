name: Generate narration MP3
on:
  workflow_dispatch:
jobs:
  tts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python3 scripts/generate_narration.py
      - uses: actions/upload-artifact@v4
        with:
          name: aviation-ai-agents-narration-mp3
          path: assets/audio/aviation-ai-agents-narration.mp3
