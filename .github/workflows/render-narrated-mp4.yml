name: Render narrated MP4
on:
  workflow_dispatch:
    inputs:
      narration_run_id:
        description: 'Run ID from Generate narration MP3 workflow'
        required: true
        type: string
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg xvfb fonts-dejavu-core
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python -m playwright install chromium
      - uses: dawidd6/action-download-artifact@v6
        with:
          workflow: generate-narration-mp3.yml
          run_id: ${{ inputs.narration_run_id }}
          name: aviation-ai-agents-narration-mp3
          path: assets/audio
      - run: test -f assets/audio/aviation-ai-agents-narration.mp3
      - run: python3 scripts/render_mp4.py
      - uses: actions/upload-artifact@v4
        with:
          name: aviation-ai-agents-demo-narrated-mp4
          path: dist/aviation-ai-agents-demo-narrated.mp4
