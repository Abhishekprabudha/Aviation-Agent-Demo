<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AIonOS Aviation AI Agents Demo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="stage">
    <video id="bgVideo" class="bg-video" src="assets/videos/aviation-ai-background-fast.mp4" muted playsinline preload="auto"></video>
    <div class="cinematic-grade"></div>
    <div class="scanlines"></div>

    <section class="topbar glass">
      <div>
        <span class="eyebrow">SMART × AIonOS</span>
        <h1>3-Minute Aviation AI Agents Command Demo</h1>
      </div>
    </section>

    <section class="hero glass">
      <div class="hero-left">
        <h2>Aviation Demo Playback</h2>
        <p>Press Start Demo to play the aviation background video with synchronized narration.</p>
      </div>
    </section>

    <section class="bottom-console glass">
      <button id="playBtn">Start Demo</button>
      <button id="pauseBtn">Pause</button>
      <button id="resetBtn">Reset</button>
      <div class="progress-shell"><div id="progress" class="progress"></div></div>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
